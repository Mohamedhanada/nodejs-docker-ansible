    docker-test:
        runs-on: ubuntu-latest
        needs: [build,codequality]  #دي عشان اقولوا ان الخطوة دي محتاجة الخطوة اللي فوقها تخلص الاول
        steps:  #دي عشان اقولوا ان الخطوة دي محتاجة الخطوة اللي فوقها تخلص الاول 
      
        - uses: actions/checkout@v6

        - name: Build Docker Image
          run: |
            docker build -t myapp .

        - name: Run Docker Container 
          run: |
           docker run --name myapp-container -d -p 3000:3000 myapp:latest    


    ansible-test:
      runs-on: ubuntu-latest
      needs: [build,codequality]
      steps:
        - uses: actions/checkout@v6

        - name: set up python 
          uses: actions/setup-python@v6
          with:
            python-version: '3.12'

        - name: set up ansible
          run: | 
            sudo apt update 
            sudo apt install ansible -y
            python -m pip install ansible-core
        

        - name: validate ansible playbook 
          run: |
            ansible-playbook playbook.yml   --syntax-check    
         
        - name: list ansible playbook 
          run: |
            ansible-playbook playbook.yaml --list-tasks
            
        - name: Run ansible playbook 
          run: |
            ansible-playbook playbook.yaml --check    