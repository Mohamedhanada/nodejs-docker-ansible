name: Integration   

on: push

jobs: 
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - name: Set up Node_js
              uses: actions/setup-node@v6
              with:
                node-version: '26.2.0'
                cache: npm

            - name: Build
              run: |
                npm install

            - name: Run Tests
              run: |
                npm run


    codequality:
        runs-on: ubuntu-latest
        needs: [build]
        steps:
            - uses: actions/checkout@v6

            - name: Set up Node_js
              uses: actions/setup-node@v6
              with:
                node-version: '26.2.0'

            - name: Run Code Quality Checks
              run: |
               node --check index.js         
     
