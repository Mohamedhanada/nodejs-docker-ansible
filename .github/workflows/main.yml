name: Integration   

on: push

jobs: 
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - name: Set up Node_js
              uses: actions/setup-node@v6
              with:
                node-version: '16'
                cache: npm

            - name: Build
              run: |
                npm install

            - name: Run Tests
              run: |
                npm run


    codequality:
        runs-on: ubuntu-latest
        needs: [build]
        steps:
            - uses: actions/checkout@v6

            - name: Set up Node_js
              uses: actions/setup-node@v6
              with:
                node-version: '16'

            - name: Run Code Quality Checks
              run: |
               node --check index.js         


                
    docker-test:
        runs-on: ubuntu-latest
        needs: [build]  #دي عشان اقولوا ان الخطوة دي محتاجة الخطوة اللي فوقها تخلص الاول 
        steps:
        - uses: actions/checkout@v6

        - name: Build Docker Image
          run: |
            docker build -t myapp .

        - name: Run Docker Container 
          run: |
           docker run --name myapp-container -d -p 3000:3000 myapp:latest    
